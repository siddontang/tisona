name: TiSona
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tisona-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build:console
        env:
          TISONA_API_ORIGIN: https://api.example.com
      - run: npx wrangler deploy --dry-run --containers-rollout=none --outdir .local/worker-build
        env:
          WRANGLER_SEND_METRICS: 'false'
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TISONA_API_ORIGIN: ${{ vars.TISONA_API_ORIGIN }}
      TISONA_CONSOLE_ORIGIN: ${{ vars.TISONA_CONSOLE_ORIGIN }}
      TISONA_RELEASE: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the Linux runtime and pinned Resonate engine
        run: docker build --tag tisona:verify .
      - name: Verify the built runtime
        run: |
          docker run --rm --entrypoint /usr/local/bin/resonate tisona:verify --version
          docker run --rm --entrypoint node tisona:verify --input-type=module -e "await import('./deploy/cloudflare/entrypoint.mjs'); await import('mysql2/promise');"
      - name: Verify Cloudflare Containers access before publishing
        run: node scripts/hosting-preflight.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Cloudflare backend
        run: node scripts/deploy-cloudflare.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TISONA_RUNTIME: ${{ secrets.TISONA_RUNTIME }}
      - name: Verify worker, execution and durable retry recovery
        run: node scripts/hosting-smoke.mjs
        env:
          TISONA_RUNTIME: ${{ secrets.TISONA_RUNTIME }}
      - name: Build the Console for the verified backend
        run: npm run build:console
        env:
          URL: ${{ vars.TISONA_CONSOLE_ORIGIN }}
      - name: Publish Netlify Console
        run: npx netlify deploy --no-build --prod --dir .netlify-dist --message "GitHub $TISONA_RELEASE"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      - name: Verify Console proxy and authenticated session
        run: node scripts/hosting-smoke.mjs --console
        env:
          TISONA_RUNTIME: ${{ secrets.TISONA_RUNTIME }}
      - name: Record release endpoints
        if: always()
        run: |
          echo "Backend: $TISONA_API_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Console: $TISONA_CONSOLE_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
          echo "Revision: $TISONA_RELEASE" >> "$GITHUB_STEP_SUMMARY"
